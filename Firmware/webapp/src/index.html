<!-- ====== Main ====== -->
<div class="main-wrapper">
  <header>
    <button id="menu-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
        <path d="M0 0h24v24H0V0z" fill="none"/>
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
    <h1 data-i18n="appTitle">ESPRC CAM</h1>
    <div style="display:flex;align-items:center;gap:.75rem">
      <select id="languageSelector" style="width:auto;padding:.35rem .6rem;font-size:.75rem">
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
      <div class="theme-switch-wrapper">
        <span data-i18n="lightMode">Light</span>
        <label class="theme-switch" for="lightModeToggle">
          <input type="checkbox" id="lightModeToggle">
          <div class="slider round"></div>
        </label>
      </div>
    </div>
  </header>

  <main>

    <!-- ═══ STREAM TAB ═══ -->
    <div id="stream" class="tab-content active">
      <div class="cam-stream-wrapper">
        <div class="cam-stream">
          <img src="" alt="Camera Stream" id="stream-img">
          <div class="cam-overlay">
            <span class="fps-badge" id="fps-counter" style="display:none"></span>
            <button id="camFullscreenBtn" class="cam-act-btn" title="Fullscreen">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="cam-stream-bar">
          <button id="startStreamBtn" class="cam-act-btn cam-act-primary" title="Start stream">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          <button id="stopStreamBtn" class="cam-act-btn" title="Stop stream">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h12v12H6z"/>
            </svg>
          </button>
          <span class="status-badge" id="stream-status" data-i18n="offline">Offline</span>
        </div>
      </div>
    </div>

    <!-- ═══ CONFIG TAB ═══ -->
    <div id="config" class="tab-content">
      <h2 data-i18n="config">Config</h2>

      <!-- Stream Settings -->
      <div class="settings-section">
        <h3 data-i18n="streamSettings">Stream</h3>
        <div class="form-grid">
          <div class="form-group">
            <label data-i18n="resolution">Resolution</label>
            <select id="framesize">
              <option value="1">QQVGA 160×120</option>
              <option value="3">HQVGA 240×176</option>
              <option value="5" selected>QVGA 320×240</option>
              <option value="6">CIF 400×296</option>
              <option value="7">HVGA 480×320</option>
              <option value="8">VGA 640×480</option>
              <option value="9">SVGA 800×600</option>
              <option value="10">XGA 1024×768</option>
              <option value="12">SXGA 1280×1024</option>
              <option value="13">UXGA 1600×1200</option>
            </select>
          </div>
          <div class="form-group slider-group">
            <label><span data-i18n="quality">Quality (low=better)</span>: <span id="camQualityValue">12</span></label>
            <input type="range" id="camQuality" min="4" max="63" value="12">
          </div>
          <div class="form-group slider-group">
            <label><span data-i18n="fpsLimit">FPS Limit (0=unlimited)</span>: <span id="fpsLimitValue">0</span></label>
            <input type="range" id="fpsLimit" min="0" max="30" value="0">
          </div>
        </div>
        <div class="cam-toggles">
          <div class="control-group">
            <label for="statsEnabled" data-i18n="statsEnabled">FPS Stats</label>
            <input type="checkbox" class="toggle" id="statsEnabled">
          </div>
        </div>
      </div>

      <!-- Image Settings -->
      <div class="settings-section">
        <h3 data-i18n="imageSettings">Image</h3>
        <div class="form-grid">
          <div class="form-group slider-group">
            <label><span data-i18n="brightness">Brightness</span>: <span id="camBrightValue">0</span></label>
            <input type="range" id="camBright" min="-2" max="2" value="0">
          </div>
          <div class="form-group slider-group">
            <label><span data-i18n="contrast">Contrast</span>: <span id="camContrastValue">0</span></label>
            <input type="range" id="camContrast" min="-2" max="2" value="0">
          </div>
          <div class="form-group slider-group">
            <label><span data-i18n="saturation">Saturation</span>: <span id="camSaturationValue">0</span></label>
            <input type="range" id="camSaturation" min="-2" max="2" value="0">
          </div>
        </div>
        <div class="cam-toggles">
          <div class="control-group">
            <label for="camHmirror" data-i18n="hMirror">H-Mirror</label>
            <input type="checkbox" class="toggle" id="camHmirror">
          </div>
          <div class="control-group">
            <label for="camVFlip" data-i18n="vFlip">V-Flip</label>
            <input type="checkbox" class="toggle" id="camVFlip">
          </div>
        </div>
      </div>

      <!-- Advanced Settings -->
      <details class="cam-advanced">
        <summary><span data-i18n="advancedSettings">Advanced Settings</span></summary>
        <div class="cam-advanced-inner">
          <div class="form-grid">
            <div class="form-group slider-group">
              <label><span data-i18n="aeLevel">AE Level</span>: <span id="camAELevelValue">0</span></label>
              <input type="range" id="camAELevel" min="-2" max="2" value="0">
            </div>
            <div class="form-group slider-group">
              <label><span data-i18n="exposure">Exposure</span>: <span id="camExpoValue">0</span></label>
              <input type="range" id="camExpo" min="0" max="1200" value="0">
            </div>
            <div class="form-group slider-group">
              <label><span data-i18n="agcGain">AGC Gain</span>: <span id="camAGCGainValue">0</span></label>
              <input type="range" id="camAGCGain" min="0" max="30" value="0">
            </div>
            <div class="form-group slider-group">
              <label><span data-i18n="gainCeiling">Gain Ceiling</span>: <span id="camGainCeilingValue">0</span></label>
              <input type="range" id="camGainCeiling" min="0" max="6" value="0">
            </div>
            <div class="form-group">
              <label data-i18n="effect">Effect (0=none)</label>
              <input type="number" id="camEffect" min="0" max="6" value="0">
            </div>
            <div class="form-group">
              <label data-i18n="wbMode">WB Mode (0=auto)</label>
              <input type="number" id="camWBMode" min="0" max="4" value="0">
            </div>
          </div>
          <div class="cam-toggles">
            <div class="control-group"><label for="camAwb" data-i18n="awb">AWB</label><input type="checkbox" class="toggle" id="camAwb" checked></div>
            <div class="control-group"><label for="camAwbGain" data-i18n="awbGain">AWB Gain</label><input type="checkbox" class="toggle" id="camAwbGain" checked></div>
            <div class="control-group"><label for="camAECSensor" data-i18n="aecSensor">AEC Sensor</label><input type="checkbox" class="toggle" id="camAECSensor" checked></div>
            <div class="control-group"><label for="camAECDSP" data-i18n="aecDsp">AEC DSP</label><input type="checkbox" class="toggle" id="camAECDSP" checked></div>
            <div class="control-group"><label for="camAGC" data-i18n="agc">AGC</label><input type="checkbox" class="toggle" id="camAGC" checked></div>
            <div class="control-group"><label for="camBPC" data-i18n="bpc">BPC</label><input type="checkbox" class="toggle" id="camBPC" checked></div>
            <div class="control-group"><label for="camWPC" data-i18n="wpc">WPC</label><input type="checkbox" class="toggle" id="camWPC" checked></div>
            <div class="control-group"><label for="camRAWGCMA" data-i18n="rawGma">RAW GMA</label><input type="checkbox" class="toggle" id="camRAWGCMA" checked></div>
            <div class="control-group"><label for="camLensCorr" data-i18n="lensCorrection">Lens Corr.</label><input type="checkbox" class="toggle" id="camLensCorr" checked></div>
            <div class="control-group"><label for="camDCW" data-i18n="dcw">DCW</label><input type="checkbox" class="toggle" id="camDCW" checked></div>
            <div class="control-group"><label for="camColorBar" data-i18n="colorBar">Color Bar</label><input type="checkbox" class="toggle" id="camColorBar"></div>
          </div>
        </div>
      </details>

      <div class="button-group">
        <button id="saveConfigBtn" data-i18n="saveConfig">Save Config</button>
      </div>
    </div>

    <!-- ═══ CONNECTION TAB ═══ -->
    <div id="connection" class="tab-content">
      <h2 data-i18n="connection">Connection</h2>

      <div class="settings-section">
        <h3 data-i18n="wifiConfig">WiFi</h3>
        <div class="form-grid">
          <div class="form-group">
            <label data-i18n="wifiMode">Mode</label>
            <div class="radio-group">
              <input type="radio" id="wifiModeAP" name="wifiMode" value="AP" checked>
              <label for="wifiModeAP" data-i18n="ap">Access Point</label>
              <input type="radio" id="wifiModeSTA" name="wifiMode" value="STA">
              <label for="wifiModeSTA" data-i18n="sta">WiFi Client</label>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="wifiSsid">WiFi SSID</label>
            <input type="text" id="wifiSsid">
          </div>
          <div class="form-group">
            <label data-i18n="wifiPass">Password</label>
            <input type="password" id="wifiPass">
          </div>
          <div class="form-group">
            <label data-i18n="hostname">Hostname</label>
            <input type="text" id="hostname" placeholder="esprc-cam">
          </div>
        </div>
        <div class="button-group">
          <button id="saveWifiBtn" data-i18n="saveWifi">Save &amp; Restart</button>
          <button class="secondary" id="scanBrainBtn" data-label="Sync from Brain" data-i18n="scanBrain">Sync from Brain</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>Device</h3>
        <div class="control-group">
          <span>IP Address</span>
          <span id="espIP" style="font-family:var(--mono);font-size:.9rem;color:var(--amber)">—</span>
        </div>
        <div class="button-group">
          <button class="secondary" id="restartBtn" data-i18n="restart">Restart</button>
          <button class="danger" id="factoryResetBtn" data-i18n="factoryReset">Factory Reset</button>
        </div>
      </div>
    </div>

    <!-- ═══ UPDATE TAB ═══ -->
    <div id="update" class="tab-content">
      <h2 data-i18n="update">Update</h2>

      <div class="settings-section" style="max-width:520px">
        <h3 data-i18n="otaUpdate">Firmware Update (OTA)</h3>
        <div id="ota-info" class="ota-info">
          <em data-i18n="otaInfoLoading">Loading firmware info...</em>
        </div>
        <div class="button-group" style="margin-bottom:.75rem;margin-top:.5rem">
          <button class="secondary" id="ota-refresh-btn" data-i18n="refresh">Refresh</button>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label data-i18n="otaSelectBin">Firmware binary (.bin)</label>
            <div class="ota-file-row">
              <button class="secondary" type="button" onclick="document.getElementById('ota-file-input').click()" data-i18n="otaChooseFile">Choose file</button>
              <span id="ota-file-label" data-i18n="otaNoFile">No file selected</span>
              <input type="file" id="ota-file-input" accept=".bin,application/octet-stream" style="display:none">
            </div>
          </div>
        </div>
        <div id="ota-progress" class="ota-progress" style="display:none">
          <div id="ota-progress-bar" class="ota-progress-bar"></div>
        </div>
        <div id="ota-progress-text" class="ota-progress-text"></div>
        <div id="ota-status" class="ota-status"></div>
        <div class="button-group">
          <button id="ota-upload-btn" class="danger" data-i18n="otaUploadBtn">Upload &amp; Reboot</button>
        </div>
        <p class="ota-warning" data-i18n="otaWarning">Warning: uploading invalid firmware can brick the device until reflashed via USB.</p>
      </div>
    </div>

  </main>
</div>

<!-- ====== Camera Fullscreen Overlay ====== -->
<div id="camFsOverlay" class="cam-fs-overlay">
  <div id="camFsStream" class="cam-fs-stream"></div>
  <div class="cam-fs-hud">
    <span id="fpsFull" class="fps-badge"></span>
    <button id="camExitFsBtn" class="cam-fs-exit-btn" title="Exit fullscreen">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>
</div>

<script src="script.js" type="module" inline></script>
